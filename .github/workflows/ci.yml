name: Build and test atlas
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py
      - run: node tools/static-test.cjs
      - run: git diff --exit-code -- index.html
      - uses: actions/upload-artifact@v4
        with:
          name: terra-offline-16k
          path: terra-offline.html
      - uses: actions/upload-artifact@v4
        with:
          name: terra-static-16k
          path: dist/
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke-test.cjs
